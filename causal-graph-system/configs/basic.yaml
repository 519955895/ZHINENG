# 基础档：输入已提供因果图，仅做图谱理解 + 推理问答
mode: basic
level: basic

# 输入输出路径（相对项目根目录，运行时自动解析）
paths:
  input_graph: data/graphs/input_graph.json      # 赛题提供的因果图
  queries: data/graphs/queries.json               # 问题列表（或为空则走交互）
  output_dir: data/output/basic/

# 推理问答配置
reasoning:
  causal_tracing:
    enabled: true
    max_depth: 5          # 追溯最大跳数
  situation_deduction:
    enabled: true
    max_hops: 3
  counterfactual:
    enabled: true
    method: ablation       # 反事实实现方式：ablation(删边模拟) / model(生成式)

# 证据约束
evidence:
  require_chain: true      # 答案必须附带证据链
  min_confidence: 0.5
