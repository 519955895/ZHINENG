# 推理档：仅提供事件列表，需完成 因果识别 + 建图 + 推理
mode: reasoning
level: reasoning

paths:
  input_events: data/events/input_events.jsonl    # 赛题提供的事件列表
  queries: data/events/queries.json
  relations_out: data/relations/relations.jsonl   # 模块2产物
  graph_out: data/graphs/graph.json               # 模块3产物
  output_dir: data/output/reasoning/

# 模块2 因果识别配置
relation:
  method: pattern        # pattern(规则/提示词基线) / classifier(判别式) / llm(生成式)
  cue_words: [导致, 引起, 因为, 致使, 造成, 引发, 由于, 后果]
  min_confidence: 0.5

# 模块3 建图配置
graph:
  drop_low_confidence: true
  conflict_strategy: keep_both   # 冲突边处理：keep_both / max_conf / min_conf

reasoning:
  causal_tracing: { enabled: true, max_depth: 5 }
  situation_deduction: { enabled: true, max_hops: 3 }
  counterfactual: { enabled: true, method: ablation }

evidence:
  require_chain: true
  min_confidence: 0.5
