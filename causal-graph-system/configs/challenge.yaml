# 挑战档：仅原始文档，全流程：事件抽取 + 因果识别 + 建图 + 推理
mode: challenge
level: challenge

paths:
  input_docs: data/raw/news.jsonl                # 原始新闻文档
  queries: data/raw/queries.json
  events_out: data/events/events.jsonl           # 模块1产物
  relations_out: data/relations/relations.jsonl  # 模块2产物
  graph_out: data/graphs/graph.json              # 模块3产物
  output_dir: data/output/challenge/

# 模块1 事件抽取配置
extraction:
  model: rule        # rule / ner / seq2seq / llm
  event_types: [灾害/事故, 政策/发布, 经济/涨跌, 社会/舆情]
  do_coreference: false
  min_confidence: 0.5

# 模块2 因果识别配置
relation:
  method: pattern
  cue_words: [导致, 引起, 因为, 致使, 造成, 引发, 由于, 后果]
  min_confidence: 0.5

# 模块3 建图配置
graph:
  drop_low_confidence: true
  conflict_strategy: keep_both

reasoning:
  causal_tracing: { enabled: true, max_depth: 5 }
  situation_deduction: { enabled: true, max_hops: 3 }
  counterfactual: { enabled: true, method: ablation }

evidence:
  require_chain: true
  min_confidence: 0.5
