<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新闻事件因果图谱 · 推理平台</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">新闻事件因果图谱 · 推理平台</span>
      <span class="brand-sub">Causal Graph Reasoning</span>
    </div>
    <div class="controls">
      <label class="ctl-label" for="datasetSelect">数据集</label>
      <select id="datasetSelect" class="select">
        <option value="">— 选择预置数据集 —</option>
      </select>
      <button id="uploadBtn" class="btn btn-ghost">导入图谱</button>
      <input type="file" id="fileInput" accept=".json,application/json" hidden />
      <button id="analyzeBtn" class="btn btn-primary">分析 / 重置</button>
    </div>
  </header>

  <main class="layout">
    <!-- 左：图谱 -->
    <section class="panel graph-panel">
      <div class="panel-head">
        <span class="panel-title">因果图谱</span>
        <span id="graphMeta" class="panel-meta"></span>
        <button id="resetHighlight" class="btn btn-mini">清除高亮</button>
      </div>
      <div id="graph" class="graph-canvas"></div>
      <div id="graphHint" class="graph-hint">加载数据集或导入图谱后显示；点击节点可快速生成问题。</div>
    </section>

    <!-- 右：分析 / 操作 / 结果 -->
    <aside class="sidebar">
      <!-- 分析 -->
      <section class="panel">
        <div class="panel-head"><span class="panel-title">图谱分析</span></div>
        <div id="analysis" class="analysis">
          <div class="empty">尚未分析</div>
        </div>
      </section>

      <!-- 三类操作 -->
      <section class="panel">
        <div class="panel-head"><span class="panel-title">推理操作</span></div>
        <div class="tabs" id="tabs">
          <button class="tab active" data-type="causal_tracing">因果追溯</button>
          <button class="tab" data-type="situation_deduction">态势推演</button>
          <button class="tab" data-type="counterfactual">反事实推理</button>
        </div>
        <div id="tabHint" class="tab-hint"></div>
        <div id="presetChips" class="chips"></div>
        <textarea id="questionInput" class="question" rows="2" placeholder="输入自然语言问题，例如：是什么导致了市民出行受阻？"></textarea>
        <button id="runBtn" class="btn btn-primary btn-block">运行推理</button>
      </section>

      <!-- 结果 -->
      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">推理结果</span>
          <span id="confBadge" class="badge"></span>
        </div>
        <div id="result" class="result">
          <div class="empty">运行推理后在此展示结果</div>
        </div>
      </section>
    </aside>
  </main>

  <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.1/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
